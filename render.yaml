services:
  # Backend REST API — deployed on Render Free Tier
  - type: web
    name: job-ai-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false           # Set in Render Dashboard: your MongoDB Atlas URI
      - key: JWT_SECRET
        generateValue: true   # Render auto-generates a secure 32-char secret
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://job-ai-vjobai.vercel.app  # Your Vercel frontend URL
      - key: MAX_FILE_SIZE
        value: 5242880
      - key: UPLOAD_DIR
        value: uploads
      - key: MYSQL_HOST
        value: ""             # Leave blank — MySQL sync only works locally with XAMPP
      - key: AI_PROVIDER
        value: none
